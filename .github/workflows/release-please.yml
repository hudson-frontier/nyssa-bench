name: Release PR

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    name: Release PR
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Verify successful CI belongs to the current main commit
        id: ready
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./scripts/github/release.cjs').verifyMain({github, context, core});
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.ready.outputs.ready == 'true'
        id: release
        with:
          target-branch: main
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Dispatch CI and labels for release PRs
        if: steps.ready.outputs.ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            await require('./scripts/github/release.cjs').dispatch({github, context, core});
